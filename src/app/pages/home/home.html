<app-splash>
  <form #myForm="ngForm" (ngSubmit)="createRoom()" class="flex flex-col">
    <app-input
      label="Nombra la partida"
      id="roomName"
      name="roomName"
      [required]="true"
      [minLength]="5"
      [maxLength]="20"
      pattern="^(?=.*[a-zA-Z])(?!(?:.*\d){4})[a-zA-Z0-9]+$"
      error="Solo letras y números, 5-20 caracteres"
      [(value)]="roomName"
    />
    <app-button class="mt-8 self-center" [disabled]="!!myForm.invalid" type="submit">
      Crear partida
    </app-button>
  </form>
</app-splash>
