<app-main [title]="title()" [userInitials]="userInitials()">
  <app-modal [(open)]="showModal" [closable]="false">
    <form #myForm="ngForm" (ngSubmit)="createPlayer()" class="flex flex-col">
      <app-input
        label="Tu nombre"
        id="playerName"
        name="playerName"
        [(value)]="playerName"
        [required]="true"
        [minLength]="5"
        [maxLength]="20"
        pattern="^(?=.*[a-zA-Z])(?!(?:.*\d){4})[a-zA-Z0-9]+$"
        error="Solo letras y números, 5-20 caracteres"
      />
      <div class="flex items-center justify-around mt-8 mb-11">
        <app-radio
          label="Jugador"
          id="player"
          name="role"
          [(selected)]="role"
          value="player"
          [required]="true"
        ></app-radio>
        <app-radio
          label="Espectador"
          id="spectator"
          name="role"
          [(selected)]="role"
          value="spectator"
          [required]="true"
        ></app-radio>
      </div>
      <app-button class="self-center" [disabled]="!!myForm.invalid" type="submit"
        >Continuar</app-button
      >
    </form>
  </app-modal>
</app-main>
